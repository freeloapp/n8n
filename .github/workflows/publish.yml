name: Publish to npm
on:
  release:
    types: [published]
jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - name: Override package identity for dev branch
        if: github.event.release.target_commitish == 'main'
        run: |
          npm pkg set name="n8n-nodes-marek-custom"
          npm pkg set repository.url="https://github.com/freeloapp/n8n.git"
          sed -i 's|api\.freelo\.io|api2.freelo.io|g' nodes/Freelo/Freelo.node.ts
          sed -i 's|api\.freelo\.io|api2.freelo.io|g' nodes/Freelo/shared/freeloApiRequest.ts
          sed -i 's|api\.freelo\.io|api2.freelo.io|g' credentials/FreeloApi.credentials.ts
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build
      - name: Publish to npm
        # Auth via npm trusted publishing (OIDC) — no token needed
        run: npm publish --provenance --ignore-scripts --access public